
services:

# CAUTION-1:  Keep in sync with docker-compose-devops.yml->db_utils
  db:
    profiles: ["app", "all"]
    container_name: ${DB_SERVER}
    image: ${IMAGE_DB}
    command: ["postgres", "-c", "log_statement=all"]
    networks:
      t51Net:
        ipv4_address: ${DB_IP}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ${DB_VOLUME}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_SCHEMA}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "PGDATABASE=${DB_SCHEMA} pg_isready -U ${DB_USER} -h localhost"]
      interval: 20s
      timeout: 5s
      retries: 5


# CAUTION-1:  Keep in sync with docker-compose-devops.yml->back_utils
  back:
    profiles: ["app", "all"]
    container_name: ${BACK_NAME}
    image: ${BACK_IMAGE}
    pull_policy: never
    build:
      context: ./back
      dockerfile: back.dockerfile
      network: t51Net
      args:
        IMAGE_MVN: ${IMAGE_MVN}
        IMAGE_JAVA: ${IMAGE_JAVA}
        # Nexus conn
        MY_USER: ${MY_USER}
        MY_PASS: ${MY_PASS}
    expose:
      - "8080"
    environment:
      - VIRTUAL_HOST=api.${MY_DOMAIN}
      - LETSENCRYPT_HOST=api.${MY_DOMAIN}
      - LETSENCRYPT_EMAIL=${MY_EMAIL}
      - VIRTUAL_PORT=8080
      # DB connection data
      - DB_SERVER=${DB_SERVER}
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    networks:
      t51Net:
        ipv4_address: ${BACK_IP}
   #depends_on:
   #  db:
   #    condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health && echo servicesAlive"]
      interval: 20s
      retries: 5



  front:
    profiles: ["app", "all"]
    container_name: ${FRONT_NAME}
    pull_policy: never
    build:
      context: ./front
      network: t51Net
      args:
        BACK_URL: ${BACK_URL}
        IMAGE_NODE: ${IMAGE_NODE}
        IMAGE_NGINX: ${IMAGE_NGINX}
        MY_USER: ${MY_USER}
        MY_PASS: ${MY_PASS}
      dockerfile: front.dockerfile
    image: ${FRONT_IMAGE}
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=${MY_DOMAIN}
      - LETSENCRYPT_HOST=${MY_DOMAIN}
      - LETSENCRYPT_EMAIL=${MY_EMAIL}
      - VIRTUAL_PORT=80
    networks:
      t51Net:
        ipv4_address: ${FRONT_IP}
   #depends_on:
   #  back:
   #    condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1 && echo servicesAlive"]
      interval: 20s
      retries: 5

